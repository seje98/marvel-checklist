name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build:pages
        env:
          VITE_NOTIFY_URL: ${{ vars.VITE_NOTIFY_URL }}

      - name: Ensure .nojekyll
        run: touch dist/.nojekyll

      # GitHub Pages отдаёт 404.html для неизвестных путей, например /list.
      # Копия index.html позволяет приложению открыть нужную страницу.
      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Publish dist to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean: true
